[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ⚠️ API ROUTES MUST COME FIRST — before the SPA fallback

[[redirects]]
  from = "/api/clinics"
  to = "/.netlify/functions/clinics"
  status = 200
  force = true

[[redirects]]
  from = "/api/appointments"
  to = "/.netlify/functions/appointments"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-login"
  to = "/.netlify/functions/admin-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200
  force = true

# SPA FALLBACK — must be LAST

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
